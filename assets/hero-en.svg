<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"
     role="img" aria-label="Publish to GitHub: Chinese as the main README, images follow the language, works even when blocked">
  <rect width="1200" height="560" fill="#FBF8F4"/>

  <!-- 标题 -->
  <text x="52" y="58" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="30" font-weight="700" fill="#2C3A42">Publish to GitHub in one go</text>
  <text x="52" y="92" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="16" fill="#6B7B85">Chinese-first README  ·  images match their language  ·  pushes even when blocked</text>

  <!-- 左边：README.md 中文 -->
  <g transform="translate(52,132)">
    <rect width="520" height="212" rx="13" fill="#FFFFFF" stroke="#E3D9CE" stroke-width="1.6"/>
    <text x="26" y="36" font-family="ui-monospace,Menlo,monospace"
          font-size="15" font-weight="600" fill="#2C3A42">README.md</text>
    <rect x="26" y="48" width="70" height="22" rx="6" fill="#EAF4EE"/>
    <text x="61" y="63" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="12.5" font-weight="600" fill="#2F6B4F">Main</text>

    <text x="26" y="100" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="14" fill="#5C6B75">This is what GitHub opens first — zero clicks for Chinese readers</text>

    <rect x="26" y="120" width="468" height="68" rx="9" fill="#FBF8F4" stroke="#EDE3D9" stroke-width="1.2"/>
    <text x="44" y="146" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#8A6A4F">![overview](assets/hero.svg)</text>
    <text x="44" y="172" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#4A7A62">↑ references the Chinese diagram (no suffix)</text>
  </g>

  <!-- 右边：README.en.md EN -->
  <g transform="translate(628,132)">
    <rect width="520" height="212" rx="13" fill="#FFFFFF" stroke="#E3D9CE" stroke-width="1.6"/>
    <text x="26" y="36" font-family="ui-monospace,Menlo,monospace"
          font-size="15" font-weight="600" fill="#2C3A42">README.en.md</text>
    <rect x="26" y="48" width="70" height="22" rx="6" fill="#EAF4EE"/>
    <text x="61" y="63" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="12.5" font-weight="600" fill="#2F6B4F">EN</text>

    <text x="26" y="100" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="14" fill="#5C6B75">Cross-linked at the top, one click for English readers</text>

    <rect x="26" y="120" width="468" height="68" rx="9" fill="#FBF8F4" stroke="#EDE3D9" stroke-width="1.2"/>
    <text x="44" y="146" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#8A6A4F">![overview](assets/hero-en.svg)</text>
    <text x="44" y="172" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#4A7A62">↑ references the English diagram (-en suffix)</text>
  </g>

  <!-- 箭头：语言配对 -->
  <path d="M436 232 L472 232" stroke="#C08A6A" stroke-width="2.4" opacity="0"/>
  <text x="52" y="378" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="15.5" font-weight="700" fill="#2C3A42">Images must follow their language — no English diagrams in a Chinese README</text>
  <text x="52" y="402" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="14" fill="#6B7B85">Checked automatically before pushing: language pairing, missing files, and HTML entities that render as pink error blocks</text>

  <!-- 底部三格 -->
  <g transform="translate(52,428)">
    <rect width="356" height="92" rx="12" fill="#FFFFFF" stroke="#E3D9CE" stroke-width="1.5"/>
    <text x="24" y="34" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="15" font-weight="700" fill="#2C3A42">1. Chinese is the main language</text>
    <text x="24" y="60" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#7C8A94">README.md is Chinese</text>
    <text x="24" y="80" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#7C8A94">English goes in README.en.md</text>
  </g>
  <g transform="translate(422,428)">
    <rect width="356" height="92" rx="12" fill="#FFFFFF" stroke="#E3D9CE" stroke-width="1.5"/>
    <text x="24" y="34" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="15" font-weight="700" fill="#2C3A42">2. Images match their language</text>
    <text x="24" y="60" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#7C8A94">no suffix = Chinese, -en = English</text>
    <text x="24" y="80" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#7C8A94">enforced by script, not eyeballing</text>
  </g>
  <g transform="translate(792,428)">
    <rect width="356" height="92" rx="12" fill="#FFFFFF" stroke="#E3D9CE" stroke-width="1.5"/>
    <text x="24" y="34" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="15" font-weight="700" fill="#2C3A42">3. Pushes when blocked</text>
    <text x="24" y="60" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#7C8A94">when github.com is unreachable</text>
    <text x="24" y="80" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#7C8A94">falls back to the REST API</text>
  </g>
</svg>
